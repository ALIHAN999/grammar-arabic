<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2e8" />
    <title>Грамматика арабского языка</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope/index.css"
    />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div class="bg"></div>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="vignette"></div>
    <div class="particles" id="particles"></div>

    <main class="app">
      <nav class="menu" aria-label="Разделы">
        <h2 class="menu-label reveal in" style="--i: 0">Разделы</h2>

        <!-- Страница: padezhi.html -->
        <a class="card reveal" style="--i: 1; --accent: var(--gold)" href="padezhi.html">
          <span class="medallion" aria-hidden="true">
            <span class="ring"></span>
            <span class="frame"></span>
            <span class="icon">
              <svg
                viewBox="0 0 32 32"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M16 4.5 27 10 16 15.5 5 10Z" class="draw" pathLength="1" />
                <path d="M5 16l11 5.5L27 16" class="draw" pathLength="1" />
                <path d="M5 22l11 5.5L27 22" class="draw" pathLength="1" />
              </svg>
            </span>
          </span>
          <span class="card-body">
            <span class="card-title">Падежи</span>
          </span>
          <span class="card-arrow" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.1"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 5l7 7-7 7" />
            </svg>
          </span>
        </a>

        <!-- Страница: idafa.html -->
        <a class="card reveal" style="--i: 2; --accent: var(--emerald)" href="idafa.html">
          <span class="medallion" aria-hidden="true">
            <span class="ring"></span>
            <span class="frame"></span>
            <span class="icon">
              <svg
                viewBox="0 0 32 32"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M14 18.6a6 6 0 0 1 0-8.5l3.4-3.4a6 6 0 0 1 8.5 8.5l-1.8 1.8"
                  class="draw"
                  pathLength="1"
                />
                <path
                  d="M18 13.4a6 6 0 0 1 0 8.5l-3.4 3.4a6 6 0 0 1-8.5-8.5l1.8-1.8"
                  class="draw"
                  pathLength="1"
                />
              </svg>
            </span>
          </span>
          <span class="card-body">
            <span class="card-title">Идафа</span>
          </span>
          <span class="card-arrow" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.1"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 5l7 7-7 7" />
            </svg>
          </span>
        </a>

        <!-- Страница: mestoimeniya.html -->
        <a class="card reveal" style="--i: 3; --accent: var(--azure)" href="mestoimeniya.html">
          <span class="medallion" aria-hidden="true">
            <span class="ring"></span>
            <span class="frame"></span>
            <span class="icon">
              <svg
                viewBox="0 0 32 32"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="16" cy="11" r="5" class="draw" pathLength="1" />
                <path
                  d="M6.5 27.5c1.4-5.4 5.1-8.2 9.5-8.2s8.1 2.8 9.5 8.2"
                  class="draw"
                  pathLength="1"
                />
              </svg>
            </span>
          </span>
          <span class="card-body">
            <span class="card-title">Местоимения</span>
          </span>
          <span class="card-arrow" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.1"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 5l7 7-7 7" />
            </svg>
          </span>
        </a>
      </nav>
    </main>

    <div class="veil" id="veil" aria-hidden="true">
      <span class="veil-mark">
        <svg viewBox="0 0 200 200" fill="none">
          <g stroke="currentColor" stroke-width="4" opacity=".9">
            <rect x="45" y="45" width="110" height="110" />
            <rect x="45" y="45" width="110" height="110" transform="rotate(45 100 100)" />
            <circle cx="100" cy="100" r="88" />
            <circle cx="100" cy="100" r="30" />
          </g>
        </svg>
      </span>
    </div>

    <script>
      (function () {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* --- частицы --- */
        var field = document.getElementById('particles');
        if (!reduce && field) {
          var frag = document.createDocumentFragment();
          for (var i = 0; i < 22; i++) {
            var dot = document.createElement('i');
            var size = (Math.random() * 3 + 1.4).toFixed(2);
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.left = (Math.random() * 100).toFixed(2) + '%';
            dot.style.top = (Math.random() * 110).toFixed(2) + '%';
            dot.style.animationDuration = (Math.random() * 9 + 8).toFixed(2) + 's';
            dot.style.animationDelay = (-Math.random() * 14).toFixed(2) + 's';
            dot.style.opacity = '0';
            frag.appendChild(dot);
          }
          field.appendChild(frag);
        }

        /* --- появление --- */
        var items = document.querySelectorAll('.reveal');
        if (reduce || !('IntersectionObserver' in window)) {
          items.forEach(function (el) {
            el.classList.add('in');
          });
        } else {
          var io = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                  entry.target.classList.add('in');
                  io.unobserve(entry.target);
                }
              });
            },
            { threshold: 0.15 }
          );
          items.forEach(function (el) {
            io.observe(el);
          });
        }

        /* --- ripple --- */
        function ripple(card, x, y) {
          if (reduce) return;
          var rect = card.getBoundingClientRect();
          var size = Math.max(rect.width, rect.height);
          var span = document.createElement('span');
          span.className = 'ripple';
          span.style.width = span.style.height = size + 'px';
          span.style.left = x - rect.left - size / 2 + 'px';
          span.style.top = y - rect.top - size / 2 + 'px';
          card.appendChild(span);
          setTimeout(function () {
            span.remove();
          }, 640);
        }

        /* --- переход --- */
        var veil = document.getElementById('veil');
        var navigating = false;

        function go(url, x, y) {
          if (navigating) return;
          navigating = true;
          if (reduce) {
            window.location.href = url;
            return;
          }
          veil.style.setProperty('--x', x + 'px');
          veil.style.setProperty('--y', y + 'px');
          document.body.classList.add('leaving');
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              veil.classList.add('on');
            });
          });
          setTimeout(function () {
            window.location.href = url;
          }, 560);
        }

        document.querySelectorAll('.card').forEach(function (card) {
          card.addEventListener('click', function (e) {
            e.preventDefault();
            var cx = typeof e.clientX === 'number' && e.clientX ? e.clientX : window.innerWidth / 2;
            var cy =
              typeof e.clientY === 'number' && e.clientY ? e.clientY : window.innerHeight / 2;
            ripple(card, cx, cy);
            go(card.getAttribute('href'), cx, cy);
          });
        });

        window.addEventListener('pageshow', function (e) {
          if (e.persisted) {
            navigating = false;
            veil.classList.remove('on');
            document.body.classList.remove('leaving');
          }
        });
      })();
    </script>
  </body>
</html>
